[project]
name = "sql-connection-module"
version = "0.1.0"
description = "Enterprise-level OOP connectors for SQL databases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aa lopez" }]
keywords = ["sql", "database", "connector", "oop", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Typing :: Typed",
]

# Core has no hard runtime dependency: pandas and DB drivers are optional and
# imported defensively. Install only the extras you need (see below).
dependencies = []

[project.optional-dependencies]
# Tabular reads (read_sql / read_sql_chunks)
pandas = ["pandas>=1.5"]

# Per-engine drivers
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.0.3"]
mssql = ["pyodbc>=5.0.0"]
oracle = ["oracledb>=2.0.0"]
snowflake = ["snowflake-connector-python>=3.0.0"]
redshift = ["psycopg2-binary>=2.9"]

# Everything (drivers + pandas)
all = [
  "pandas>=1.5",
  "psycopg2-binary>=2.9",
  "pymysql>=1.0.3",
  "pyodbc>=5.0.0",
  "oracledb>=2.0.0",
  "snowflake-connector-python>=3.0.0",
]

# Development toolchain
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.5",
  "mypy>=1.8",
  "pip-tools>=7.0",
  "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/aalopez76/SQL-Connection-Module"
Repository = "https://github.com/aalopez76/SQL-Connection-Module"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sql_connection = ["py.typed"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Tooling configuration (pytest config still lives in pytest.ini)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true

[tool.coverage.run]
source = ["sql_connection"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
